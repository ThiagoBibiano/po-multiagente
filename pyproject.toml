[project]
name = "po-multiagente"
version = "0.1.0.dev0"
description = "Plataforma multiagente low-code que formula, resolve e explica problemas de PL e PLIM descritos em português."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago Bibiano da Silva" }]
requires-python = ">=3.11"
keywords = ["pesquisa operacional", "otimização", "llm", "multiagente", "programação linear"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Dependências entram na fase que as usa (docs/plano.md, seção 9): o pacote
# só declara o que importa de fato.
dependencies = [
    "langgraph>=1.2,<2",
    "lark>=1.2,<2",
    "openai>=3.19,<4",
    "openpyxl>=3.1,<4",
    # <4: o PuLP 4 remove o CBC 2.10.3 embutido, versão fixada no TG (ADR-006).
    "pulp>=3.3,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Repository = "https://github.com/ThiagoBibiano/po-multiagente"
Changelog = "https://github.com/ThiagoBibiano/po-multiagente/blob/main/CHANGELOG.md"

[project.scripts]
po-multiagente = "po_multiagente.cli:main"

# Adaptadores de solver (ADR-006): um solver novo é um arquivo de adaptador e
# uma linha aqui.
[project.entry-points."po_multiagente.solvers"]
pulp = "po_multiagente.solver.adaptador_pulp:BackendPulp"

[project.optional-dependencies]
interface = [
    "gradio>=6.28,<7",
]

[dependency-groups]
dev = [
    "gradio>=6.28,<7",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pre-commit>=4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-openpyxl>=3.1",
    "types-pyyaml>=6.0.12.20260906",
]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "D",            # pydocstyle
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtins
    "C4",           # comprehensions
    "SIM",          # simplify
    "RET",          # return
    "PTH",          # pathlib
    "PT",           # pytest-style
    "ANN",          # annotations
    "TID",          # tidy-imports
    "ERA",          # código comentado
    "PL",           # pylint
    "RUF",
]
ignore = [
    # Texto em português usa travessões, "×" e aspas tipográficas de propósito.
    "RUF001", "RUF002", "RUF003",
    # Exceções em português levam o prefixo "Erro" (ADR-005), e não o sufixo "Error".
    "N818",
    # Estilo Google: os argumentos do construtor ficam na docstring da classe.
    "D107",
]

[tool.ruff.lint.pylint]
# Despacho por `match` sobre os nós da árvore sintática: um return por variante.
max-returns = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "PLR0913"]

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

# O PuLP não publica anotações de tipo; só o adaptador o importa.
[[tool.mypy.overrides]]
module = ["pulp", "pulp.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# Pytest e cobertura
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["po_multiagente"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# Contratos de arquitetura (ADR-010). `lint-imports` roda no pre-commit e no
# CI; um import que viole as camadas quebra o build.
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "po_multiagente"

[[tool.importlinter.contracts]]
name = "Camadas: cada camada só importa as de baixo"
type = "layers"
containers = ["po_multiagente"]
layers = [
    "cli",
    "interface | experimento",
    "orquestracao | avaliacao",
    "agentes",
    "validacao | rastreabilidade",
    "solver | llm",
    "modelo | dados",
    "config",
    "dominio",
]

[[tool.importlinter.contracts]]
name = "Gabarito inacessível ao caminho de execução"
type = "forbidden"
source_modules = [
    "po_multiagente.agentes",
    "po_multiagente.orquestracao",
    "po_multiagente.interface",
    "po_multiagente.dados",
    "po_multiagente.llm",
    "po_multiagente.modelo",
    "po_multiagente.solver",
    "po_multiagente.validacao",
    "po_multiagente.rastreabilidade",
]
forbidden_modules = ["po_multiagente.avaliacao"]

[[tool.importlinter.contracts]]
name = "Avaliação não depende de LLM nem dos agentes"
type = "forbidden"
source_modules = ["po_multiagente.avaliacao"]
forbidden_modules = [
    "po_multiagente.agentes",
    "po_multiagente.orquestracao",
    "po_multiagente.llm",
    "po_multiagente.interface",
]
